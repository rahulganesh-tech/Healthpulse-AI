durations:
  - pattern: '(?i)(\d+)\s*(?:naala|naal|days?|naatkal)'
    unit: "days"
  - pattern: '(?i)(?:oru|one)\s*(?:naal|day)'
    value: 1
    unit: "days"
  - pattern: '(?i)(?:rendu|two|2)\s*(?:naala|naal|days?)'
    value: 2
    unit: "days"
  - pattern: '(?i)(?:moonu|three|3)\s*(?:naala|naal|days?)'
    value: 3
    unit: "days"
  - pattern: '(?i)(?:naalu|four|4)\s*(?:naala|naal|days?)'
    value: 4
    unit: "days"
  - pattern: '(?i)(?:anju|five|5)\s*(?:naala|naal|days?)'
    value: 5
    unit: "days"
  - pattern: '(?i)(?:oru\s*vaaram|1\s*week|one\s*week)'
    value: 7
    unit: "days"
  - pattern: '(?i)(?:rendu\s*vaaram|2\s*weeks|two\s*weeks)'
    value: 14
    unit: "days"
  - pattern: '(?i)(?:kalai|morning|iniku\s*kaalaila|since\s*morning)'
    value: 1
    unit: "days"
